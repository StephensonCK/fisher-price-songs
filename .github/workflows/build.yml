name: Build static pages

# Rebuilds the crawlable pages (toys/*, sitemap.xml, 404.html, home page SEO block)
# whenever the data or the build inputs change, e.g. after someone saves in the editor.
on:
  push:
    branches: [main]
    paths:
      - data/toys.json
      - scripts/build.mjs
      - CNAME
      - index.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-static-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Rebuild static pages"
            git pull --rebase
            git push
          fi
